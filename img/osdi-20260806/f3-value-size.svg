<text x="96.0" y="51.0" font-size="9.5" fill="#0f172a" text-anchor="start" font-weight="600">달리한 것: 값 크기만 (16·32·64·152 B). 크기마다 재프리로드, 서버 구성 고정</text>
<text x="96.0" y="64.0" font-size="9.5" fill="#64748b" text-anchor="start" font-weight="400">점 = CPU/op = busyCPU ÷ 처리량 (busy 는 네 셀 다 29.8~29.9 로 포화)</text>
<text x="96.0" y="77.0" font-size="9.5" fill="#64748b" text-anchor="start" font-weight="400">파선 = 최소제곱 2.00 µs + 4.05 ns/B (네 점 잔차 2% 안)</text>
<text x="96.0" y="90.0" font-size="9.5" fill="#64748b" text-anchor="start" font-weight="400">xfer 12.96→16.36 µs · crypto 0.51→0.76 µs — 바이트 비용은 전송이지 암복호가 아니다</text>
<text x="96.0" y="103.0" font-size="9.5" fill="#64748b" text-anchor="start" font-weight="400">점 아래 숫자 = GET-only 처리량. 152 B 는 수용 상한(pac_fallback 0)</text>
